<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVoiceAI | Admin Login</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d1b;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: #111a2e;
            border: 1px solid rgba(0, 220, 220, 0.25);
            border-radius: 18px;
            box-shadow: 0 0 35px rgba(0, 220, 220, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #35dddd;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #aab6ca;
            font-size: 14px;
        }

        .login-form label {
            display: block;
            color: #dce5f5;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .login-form input {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            background: #080f20;
            border: 1px solid #293750;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border-color: #35dddd;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #20cccc;
            color: #07111d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #54eeee;
            box-shadow: 0 0 18px rgba(32, 204, 204, 0.3);
        }

        .security-note {
            text-align: center;
            color: #7f91aa;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-header">

            <h1>SecureVoiceAI</h1>

            <p>Administrator Authentication</p>

        </div>

        <form
            class="login-form"
            action="/admin/login"
            method="POST"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label for="username">Admin Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
                minlength="3"
                maxlength="30"
                autocomplete="username"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
                autocomplete="current-password"
            >

            <button
                type="submit"
                class="login-button"
            >
                Secure Login
            </button>

        </form>

        <div class="security-note">
            Protected Administrator Access
        </div>

    </div>

</body>
</html>
