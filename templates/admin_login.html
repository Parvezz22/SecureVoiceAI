<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVoiceAI | Admin Login</title>

    <!-- Prevent theme flash by applying saved theme before styles render -->
    <script>
        (function () {
            try {
                var storedTheme = localStorage.getItem("securevoice_theme");
                var theme = (storedTheme === "light" || storedTheme === "dark") ? storedTheme : "dark";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <link rel="stylesheet" href="/static/style.css">

    <!-- Theme Manager -->
    <script src="/static/theme.js" defer></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d1b;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: #111a2e;
            border: 1px solid rgba(0, 220, 220, 0.25);
            border-radius: 18px;
            box-shadow: 0 0 35px rgba(0, 220, 220, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #35dddd;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #aab6ca;
            font-size: 14px;
        }

        .login-form label {
            display: block;
            color: #dce5f5;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .login-form input {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            background: #080f20;
            border: 1px solid #293750;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border-color: #35dddd;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #20cccc;
            color: #07111d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #54eeee;
            box-shadow: 0 0 18px rgba(32, 204, 204, 0.3);
        }

        .security-note {
            text-align: center;
            color: #7f91aa;
            font-size: 12px;
            margin-top: 25px;
        }

        /* Theme toggle fixed to the top-right corner */
        .login-theme-toggle {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 50;
        }

        /* Light theme overrides for hardcoded dark colors in this inline style block */
        [data-theme="light"] body {
            background: #f8fafc;
        }

        [data-theme="light"] .login-container {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(14, 165, 233, 0.22);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        }

        [data-theme="light"] .login-header h1 {
            color: #0284c7;
        }

        [data-theme="light"] .login-header p {
            color: #475569;
        }

        [data-theme="light"] .login-form label {
            color: #334155;
        }

        [data-theme="light"] .login-form input {
            background: #ffffff;
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #0f172a;
        }

        [data-theme="light"] .login-form input:focus {
            border-color: #0284c7;
        }

        [data-theme="light"] .login-button {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
        }

        [data-theme="light"] .login-button:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
            box-shadow: 0 0 18px rgba(2, 132, 199, 0.3);
        }

        [data-theme="light"] .security-note {
            color: #64748b;
        }
    </style>
</head>

<body>

    <!-- THEME TOGGLE (top-right, fixed) -->
    <div class="login-theme-toggle">
        <button type="button" class="theme-toggle-btn" aria-label="Switch to light mode" title="Switch to light mode">
            <span class="theme-icon" aria-hidden="true">☀️</span>
            <span class="theme-label">Light Mode</span>
        </button>
    </div>

    <div class="login-container">

        <div class="login-header">

            <h1>SecureVoiceAI</h1>

            <p>Administrator Authentication</p>

        </div>

        <form
            class="login-form"
            action="/admin/login"
            method="POST"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label for="username">Admin Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
                minlength="3"
                maxlength="30"
                autocomplete="username"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
                autocomplete="current-password"
            >

            <button
                type="submit"
                class="login-button"
            >
                Secure Login
            </button>

        </form>

        <div class="security-note">
            Protected Administrator Access
        </div>

    </div>

</body>
</html>
